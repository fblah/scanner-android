name: Build APK
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Signing key missing; refusing to generate a replacement'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/scan.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/scan.jks" >> "$GITHUB_ENV"
      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VERSION="0.1.0-dev.${GITHUB_RUN_NUMBER}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          ./gradlew assembleRelease -PappVersion="$VERSION" -PappVersionCode="$GITHUB_RUN_NUMBER"
          cp app/build/outputs/apk/release/app-release.apk scan.apk
      - uses: actions/upload-artifact@v4
        with:
          name: scan-signed-apk
          path: scan.apk
      - name: Publish download
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            cp scan.apk "scan-${GITHUB_REF_NAME}.apk"
            gh release create "$GITHUB_REF_NAME" "scan-${GITHUB_REF_NAME}.apk" --title "Scan ${GITHUB_REF_NAME}" --generate-notes
          else
            git tag --force latest "$GITHUB_SHA"
            git push origin refs/tags/latest --force
            if gh release view latest >/dev/null 2>&1; then
              gh release edit latest --title 'Scan (latest development build)' --notes "Development build $GITHUB_RUN_NUMBER from $GITHUB_SHA. Feature parity is in progress." --prerelease
              gh release upload latest scan.apk --clobber
            else
              gh release create latest scan.apk --title 'Scan (latest development build)' --notes 'Feature parity is in progress.' --prerelease
            fi
          fi
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/scan.jks"
